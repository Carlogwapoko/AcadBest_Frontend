<div class="photo-box">
  @if (!failed) {
    <img [src]="src" [alt]="alt" (error)="failed = true">
  } @else {
    <div class="placeholder">
      <strong>Campus photo unavailable</strong>
      <span>Please check your internet connection and try again.</span>
    </div>
  }
  <div class="caption-bar">
    <strong>{{caption}}</strong>
    @if (subcaption) {
      <span>{{subcaption}}</span>
    }
  </div>
</div>
