<div class="grid g2"><div class="card"><h3>New announcement</h3>
<app-field label="Title" [error]="e['t']"><input maxlength="80" [(ngModel)]="f.t" [class.bad]="e['t']" placeholder="Enter announcement title"></app-field>
<app-field label="Message" [error]="e['m']"><textarea rows="5" maxlength="500" [(ngModel)]="f.m" [class.bad]="e['m']" placeholder="Enter announcement message"></textarea></app-field>
<div class="r2"><app-field label="Program"><select [(ngModel)]="f.prog"><option>All Programs</option><option>BSTM</option><option>BSED</option><option>BEED</option><option>BSE</option><option>BSMA</option><option>BSHM</option><option>BSIT</option><option>BSBA</option><option>STEM</option><option>ABM</option><option>HUMSS</option><option>GAS</option><option>TVL</option></select></app-field><app-field label="Year level"><select [(ngModel)]="f.yr"><option>All Years</option><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option><option value="11">Grade 11</option><option value="12">Grade 12</option></select></app-field></div>
<div class="r2"><app-field label="Section"><select [(ngModel)]="f.sec"><option>All Sections</option><option>A</option><option>B</option></select></app-field><div></div></div>
<div class="r2"><app-field label="Publish date" [error]="e['dt']"><input type="date" [min]="d.today" [(ngModel)]="f.dt" [class.bad]="e['dt']"></app-field><app-field label="Valid until (optional)" [error]="e['end']"><input type="date" [min]="d.today" [(ngModel)]="f.end" [class.bad]="e['end']"></app-field></div>
<div class="acts"><button class="btn" [disabled]="busy" (click)="publish()">@if(busy){<span class="sp"></span>}Publish</button></div></div>
<div class="card"><h3>Recently posted</h3><app-ann-list [items]="d.anns.slice(0,5)" [loading]="d.loading||!!d.loadError"/></div></div>
