<div class="grid g2"><div class="card"><h3>Calendar</h3>
<div class="calh"><button class="btn sec sm" (click)="go(-1)" aria-label="Previous month"><app-icon name="chevL" [size]="16"/></button><b>{{label}}</b><button class="btn sec sm" (click)="go(1)" aria-label="Next month"><app-icon name="chevR" [size]="16"/></button></div>
<div class="calg">@for(h of ['S','M','T','W','T','F','S'];track $index){<span>{{h}}</span>}@for(b of blanks;track $index){<i></i>}
@for(c of days;track c.k){<button class="cd" [class.has]="c.has" [class.td]="c.k==d.today" [class.sl]="sel==c.k" (click)="sel=sel==c.k?'':c.k">{{c.n}}</button>}</div>
<p class="sub" style="margin-top:12px">Dots mark announcement dates. Select a day to filter.</p></div>
<div class="card"><h3>@if(sel){Announcements on {{sel}} <button class="btn sec sm" (click)="sel=''">Show all</button>}@else{All announcements}</h3><app-ann-list [items]="list" [loading]="d.loading||!!d.loadError" emptyMessage="No records found. No announcements are available for your program, year, and section."/></div></div>
