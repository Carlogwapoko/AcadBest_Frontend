<div class="feature-content setting-form"><h3>Academic standing thresholds</h3>
<p style="color:var(--mu)">Average ≥ Good Standing → <span class="chip ok">Good</span> · between → <span class="chip wn">At Risk</span> · below passing → <span class="chip er">Failing</span></p>
<app-field label="Passing grade (50–95)" [error]="e['p']"><input type="number" step="0.5" [(ngModel)]="pass" [class.bad]="e['p']" placeholder="Enter passing grade"></app-field>
<app-field label="Good Standing minimum (must be above passing, max 100)" [error]="e['s']"><input type="number" step="0.5" [(ngModel)]="safe" [class.bad]="e['s']" placeholder="Enter minimum grade"></app-field>
<div class="acts"><button class="btn" [disabled]="busy" (click)="save()">@if(busy){<span class="sp"></span>}Save Rules</button></div>
<p style="font-size:12px;color:var(--mu)">Currently flags {{d.atRisk().length}} of {{d.students.length}} students.</p></div>
