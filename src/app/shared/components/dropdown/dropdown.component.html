<div class="select-control">
  <button #trigger type="button" class="select-trigger" [id]="id" role="combobox"
    [disabled]="disabled" [attr.aria-labelledby]="labelId||null" [attr.aria-label]="labelId?null:ariaLabel||null"
    aria-haspopup="listbox" [attr.aria-expanded]="open" [attr.aria-controls]="id+'-options'"
    [attr.aria-activedescendant]="open&&activeIndex>=0?id+'-option-'+activeIndex:null"
    [attr.aria-invalid]="bad?'true':null"
    (click)="toggle()" (keydown)="onKeydown($event)">
    <span>{{ selectedLabel }}</span><span class="select-arrow" aria-hidden="true"></span>
  </button>
  <span class="dropdown-source" aria-hidden="true"><ng-content></ng-content></span>
</div>
<div #optionList class="select-list" role="listbox" [id]="id+'-options'"
  [attr.aria-labelledby]="labelId||null" [hidden]="!open">
  @for(option of options;track option.value;let i=$index){
    <div class="select-option" role="option" [id]="id+'-option-'+i"
      [attr.data-option-index]="i"
      [attr.aria-selected]="multiple ? selectedValues.includes(option.value) : option.value===value"
      [attr.aria-disabled]="option.disabled" [class.selected]="multiple ? selectedValues.includes(option.value) : option.value===value"
      [class.active]="i===activeIndex" (mouseenter)="activeIndex=i"
      (click)="select(option)"><input type="checkbox" [hidden]="!multiple" [checked]="multiple && selectedValues.includes(option.value)" tabindex="-1" aria-hidden="true">{{option.label}}</div>
  }
</div>
