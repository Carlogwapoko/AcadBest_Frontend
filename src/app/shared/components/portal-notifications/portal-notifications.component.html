<div class="feature-content">
  <div class="row" style="align-items:center">
    <span class="sub" style="flex:1;min-width:200px">Announcements and portal updates. {{unread?unread+' unread.':'You are all caught up.'}}</span>
    <button class="btn sec" style="flex:0 0 auto" [disabled]="markingAll||!unread" (click)="markAll()">@if(markingAll){<span class="sp"></span>}@else{<app-icon name="check" [size]="16"/>}Mark all as read</button>
  </div>
  @if(error){<div class="empty" role="alert">{{error}}</div>}
  @for(n of list;track n.id){
    <button type="button" class="ann nt notification-item" [class.unread]="!n.read" (click)="read(n)">
      <span class="ni alert"><app-icon name="alert" [size]="18"/></span>
      <span class="notification-copy"><b>{{n.t}}</b>@if(!n.read){ <span class="chip">New</span>}<br><span class="notification-message">{{n.m}}</span><br><small>{{n.d}}</small></span>
      @if(reading.has(n.id)){<span class="sp" role="status" aria-label="Marking as read"></span>}
    </button>
  } @empty {
    @if(!d.loading&&!d.loadError){<div class="empty"><div class="eic"><app-icon name="bell" [size]="24"/></div>No records found. No notifications yet.</div>}
  }
</div>
