<div id="app" class="on" [class.student-interface]="auth.role==='student'" [class.faculty-interface]="auth.role==='faculty'">
@if(open){<button class="nav-scrim" type="button" aria-label="Close navigation menu" (click)="open=false"></button>}
<aside id="sidebar" [class.open]="open"><div class="logo"><i class="lm">A</i><div>Acad<span>Best</span><small>ACES Tagum College</small></div></div>
@for(n of nav;track n.path){<a class="nb" [routerLink]="n.path" routerLinkActive="on" (click)="open=false"><app-icon [name]="n.icon" [size]="19"/>{{n.label}}@if(n.key=='nt'&&unread){<span class="bd" style="display:inline-block">{{unread}}</span>}</a>}
<button class="nb" (click)="logout()"><app-icon name="out" [size]="19"/>Log Out</button></aside>
<main><div class="top"><button class="btn sec hb" (click)="open=!open" aria-label="Menu" aria-controls="sidebar" [attr.aria-expanded]="open"><app-icon name="menu"/></button><h2>{{title}}</h2><span class="chip" id="who">{{auth.user?.name||''}} · {{roleName}}</span><a class="av" routerLink="profile" title="My profile">@if(auth.user?.avatar;as avatar){<img [src]="avatar" alt="">}@else{ {{initials}} }</a></div>
@if(d.loadError){<div class="card" role="alert">{{d.loadError}} <button class="btn sec sm" (click)="retry()">Retry</button></div>}
<router-outlet/></main></div>
