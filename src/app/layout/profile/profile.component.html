<section class="card profile-card" aria-labelledby="profile-heading">
  <header class="profile-header">
    <div class="profile-avatar" [class.has-photo]="u.avatar">
      @if(u.avatar){<img [src]="u.avatar" alt="Your profile picture">}@else{<span>{{initials}}</span>}
    </div>
    <div class="profile-heading">
      <h3 id="profile-heading">{{u.name}}</h3>
      <span class="chip">{{u.role}}</span>
    </div>
  </header>

  <dl class="profile-details">
    <div><dt>Full name</dt><dd>{{u.name}}</dd></div>
    <div><dt>Middle name</dt><dd>{{u.middle_name||'Not provided'}}</dd></div>
    <div><dt>E-mail</dt><dd>{{u.email}}</dd></div>
    <div><dt>Role</dt><dd>{{u.role}}</dd></div>
    <div><dt>Mobile number</dt><dd>{{u.phone||'Not provided'}}</dd></div>
  </dl>
  <p class="sub profile-note"><app-icon name="shield" [size]="14"/> Profile information and pictures are managed by the school administrator.</p>
</section>
